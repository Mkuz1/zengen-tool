plugins {
    id 'com.android.application'
}

// Release signing: keystore.properties (local, never committed) or MKBOARD_* environment variables (CI).
def ksProps = new Properties()
def ksPropsFile = rootProject.file('keystore.properties')
if (ksPropsFile.exists()) ksPropsFile.withInputStream { ksProps.load(it) }
def ksPath = System.getenv('MKBOARD_KEYSTORE') ?: ksProps.getProperty('storeFile')

android {
    namespace 'com.mkboard.keyboard'
    compileSdk 35

    defaultConfig {
        applicationId "com.mkboard.keyboard"
        minSdk 28
        targetSdk 34
        versionCode 3
        versionName "2.1.0"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile rootProject.file(ksPath)
                storePassword System.getenv('MKBOARD_KEYSTORE_PASSWORD') ?: ksProps.getProperty('storePassword')
                keyAlias System.getenv('MKBOARD_KEY_ALIAS') ?: ksProps.getProperty('keyAlias')
                keyPassword System.getenv('MKBOARD_KEY_PASSWORD') ?: ksProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // In-app updates only install over a build signed with the same key, so releases use the
            // MK Board release key when available (falls back to the debug key for local test builds).
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

android {
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'robolectric.graphicsMode', 'NATIVE'
                systemProperty 'shots.dir', "${rootDir}/shots"
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
