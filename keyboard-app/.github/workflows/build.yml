name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MKBoard-test-build
          path: app/build/outputs/apk/release/app-release.apk
