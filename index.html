<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenGen Studio | AI Nature Video Generator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="startScreen" class="splash-screen">
        <div class="splash-content">
            <i class="fa-solid fa-wave-square fa-3x"></i>
            <h1>ZenGen Studio</h1>
            <p>Initialize Procedural Audio Engine & Enter Workspace</p>
            <button onclick="initStudio()" class="btn-enter">Enter Studio</button>
        </div>
    </div>

    <div id="workspace" class="workspace" style="display: none;">
        
        <nav>
            <div class="brand">
                <i class="fa-solid fa-layer-group"></i> ZenGen <span>PRO</span>
            </div>
            
            <div class="status-pill" id="statusPill">
                <div class="dot"></div> Ready
            </div>
        </nav>

        <div class="main-layout">
            
            <aside class="sidebar">
                <div class="control-group">
                    <label>SELECT THEME</label>
                    <div class="custom-select">
                        <select id="themeSelect">
                            <option value="forest">🌲 Forest Ambience</option>
                            <option value="ocean">🌊 Ocean Waves</option>
                            <option value="rain">🌧️ Heavy Rain</option>
                            <option value="fireplace">🔥 Crackling Fire</option>
                            <option value="snow">❄️ Arctic Wind</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <div class="control-group">
                    <button id="generateBtn" onclick="generateContent()" class="btn-primary">
                        <i class="fa-solid fa-rotate"></i> Find New Content
                    </button>
                </div>

                <div class="divider"></div>

                <div class="control-group">
                    <button id="recordBtn" disabled onclick="startRecording()" class="btn-record">
                        <div class="rec-icon"></div> Record (1 Min)
                    </button>
                    <p class="hint">Export Format: MP4 / WebM</p>
                </div>
            </aside>

            <main class="monitor-section">
                <div class="video-wrapper">
                    <video id="mainVideo" crossOrigin="anonymous" loop playsinline muted></video>
                    
                    <div id="audioVisualizer" class="visualizer-overlay">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                    
                    <audio id="bgAudio" crossOrigin="anonymous" loop></audio>
                </div>
            </main>

            <aside class="meta-sidebar" id="metaPanel">
                <div class="meta-header">
                    <h3>SEO Metadata</h3>
                </div>
                
                <div class="meta-field">
                    <label>Generated Title</label>
                    <div class="input-row">
                        <input type="text" id="videoTitle" readonly placeholder="Title will appear here...">
                        <button onclick="copyToClip('videoTitle')" title="Copy Title"><i class="fa-regular fa-copy"></i></button>
                    </div>
                </div>

                <div class="meta-field">
                    <label>Description</label>
                    <div class="input-row">
                        <textarea id="videoDesc" rows="5" readonly placeholder="Description will appear here..."></textarea>
                        <button onclick="copyToClip('videoDesc')" title="Copy Description"><i class="fa-regular fa-copy"></i></button>
                    </div>
                </div>

                <div class="meta-field">
                    <label>Viral Tags (15 Unique)</label>
                    <div class="input-row">
                        <textarea id="videoTags" rows="4" readonly placeholder="#tags #will #appear #here"></textarea>
                        <button onclick="copyToClip('videoTags')" title="Copy Tags"><i class="fa-regular fa-copy"></i></button>
                    </div>
                </div>

                <div class="upload-shortcuts">
                    <label>Quick Upload Shortcuts</label>
                    <div class="social-grid">
                        <a href="https://studio.youtube.com" target="_blank" class="s-link yt" title="Upload to YouTube"><i class="fa-brands fa-youtube"></i></a>
                        <a href="https://www.tiktok.com/upload" target="_blank" class="s-link tt" title="Upload to TikTok"><i class="fa-brands fa-tiktok"></i></a>
                        <a href="https://www.instagram.com/" target="_blank" class="s-link ig" title="Upload to Instagram"><i class="fa-brands fa-instagram"></i></a>
                        <a href="https://www.facebook.com/latest/composer" target="_blank" class="s-link fb" title="Upload to Facebook"><i class="fa-brands fa-facebook"></i></a>
                    </div>
                </div>
            </aside>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
