<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenGen Studio | Bulletproof</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="startScreen" class="splash-screen">
        <div class="splash-content">
            <i class="fa-solid fa-wave-square fa-3x"></i>
            <h1>ZenGen Studio</h1>
            <p>Initialize Audio Engine & Enter Workspace</p>
            <button id="enterStudioBtn" class="btn-enter">Enter Studio</button>
        </div>
    </div>

    <div id="workspace" class="workspace" style="display: none;">
        <nav>
            <div class="brand"><i class="fa-solid fa-layer-group"></i> ZenGen <span>PRO</span></div>
            <div class="status-pill" id="statusPill"><div class="dot"></div> System Ready</div>
        </nav>

        <div class="main-layout">
            <aside class="sidebar">
                
                <div class="control-group">
                    <label>1. VISUAL THEME</label>
                    <div class="custom-select">
                        <select id="themeSelect">
                            <option value="forest">Forest</option>
                            <option value="ocean">Ocean</option>
                            <option value="rain">Rain</option>
                            <option value="fireplace">Fireplace</option>
                            <option value="snow">Snow</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <div class="control-group">
                    <label>2. AUDIO TRACK</label>
                    <div class="custom-select">
                        <select id="audioVariant">
                            <!-- Options will be loaded dynamically -->
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <div class="control-group">
                    <button id="generateBtn" class="btn-primary">
                        <i class="fa-solid fa-rotate"></i> Create Montage
                    </button>
                </div>
                
                <div class="divider"></div>

                <div class="control-group">
                    <button id="recordBtn" disabled class="btn-record">
                        <div class="rec-icon"></div> Record (1 Min)
                    </button>
                </div>
            </aside>

            <main class="monitor-section">
                <div class="video-wrapper">
                    <video id="vid1" class="active" crossorigin="anonymous" playsinline muted></video>
                    <video id="vid2" class="standby" crossorigin="anonymous" playsinline muted></video>
                    
                    <div class="playback-controls">
                        <button id="playPauseBtn"><i class="fa-solid fa-pause"></i></button>
                    </div>

                    <div id="audioVisualizer" class="visualizer-overlay">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                </div>
            </main>

            <aside class="meta-sidebar" id="metaPanel">
                <div class="meta-header"><h3>SEO Metadata</h3></div>
                <div class="meta-field">
                    <label>Title</label>
                    <div class="input-row">
                        <input type="text" id="videoTitle" readonly>
                        <button id="copyTitleBtn"><i class="fa-regular fa-copy"></i></button>
                    </div>
                </div>
                <div class="meta-field">
                    <label>Description</label>
                    <div class="input-row">
                        <textarea id="videoDesc" rows="5" readonly></textarea>
                        <button id="copyDescBtn"><i class="fa-regular fa-copy"></i></button>
                    </div>
                </div>
                <div class="meta-field">
                    <label>Tags (20+)</label>
                    <div class="input-row">
                        <textarea id="videoTags" rows="6" readonly></textarea>
                        <button id="copyTagsBtn"><i class="fa-regular fa-copy"></i></button>
                    </div>
                </div>
                <div class="upload-shortcuts">
                    <label>Share To</label>
                    <div class="social-grid">
                        <a href="https://studio.youtube.com" target="_blank" class="s-link yt">
                            <i class="fa-brands fa-youtube"></i>
                        </a>
                        <a href="https://www.tiktok.com/upload" target="_blank" class="s-link tt">
                            <i class="fa-brands fa-tiktok"></i>
                        </a>
                        <a href="https://www.instagram.com/" target="_blank" class="s-link ig">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                        <a href="https://www.facebook.com/latest/composer" target="_blank" class="s-link fb">
                            <i class="fa-brands fa-facebook"></i>
                        </a>
                    </div>
                </div>
            </aside>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
