<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenGen Studio | Natural Sounds & MP4 Videos</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Audio Controls */
        .audio-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
        }
        
        .audio-preview {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .audio-preview:hover {
            background: rgba(59, 130, 246, 0.2);
        }
        
        .audio-preview i {
            color: #3b82f6;
        }
        
        .audio-status-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .audio-status-indicator.playing {
            background: rgba(34, 197, 94, 0.7);
        }
        
        /* MP4 Badge */
        .mp4-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(59, 130, 246, 0.9);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        
        /* Theme Preview */
        .theme-preview {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        
        .theme-sample {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border 0.2s;
        }
        
        .theme-sample:hover {
            border-color: #3b82f6;
        }
        
        .theme-sample.active {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        
        /* Loading Overlay */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }
        
        .loading-text {
            margin-top: 20px;
            font-size: 18px;
        }
        
        .loading-subtext {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.7;
            max-width: 300px;
            text-align: center;
        }
        
        /* Video Info */
        .video-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            max-width: 200px;
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Loading...</div>
        <div class="loading-subtext" id="loadingSubtext">Please wait</div>
    </div>

    <div id="startScreen" class="splash-screen">
        <div class="splash-content">
            <i class="fa-solid fa-mountain fa-3x"></i>
            <h1>ZenGen Studio</h1>
            <p>Royalty-Free Natural Sounds & MP4 Videos</p>
            <button id="enterStudioBtn" class="btn-enter">Enter Studio</button>
            <div style="margin-top: 30px; font-size: 12px; opacity: 0.7; max-width: 400px;">
                <i class="fas fa-check-circle"></i> Features:<br>
                • Royalty-free natural sounds from Mixkit.co<br>
                • MP4 video output (YouTube/TikTok/Instagram ready)<br>
                • SEO-optimized metadata<br>
                • No
