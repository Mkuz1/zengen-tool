name: Build SAB Passw APK

on:
  push:
    paths:
      - 'sab-passw/**'
      - 'sab-passw-android/**'
      - '.github/workflows/sab-passw-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.SAB_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAB_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SAB_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/sab-release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "Using the signing key from repository secrets."
          else
            # No stored key: sign with a one-off key. Installs work, but a later build can't update this one in place.
            KS_PASS="$(openssl rand -hex 24)"; KEY_PASS="$KS_PASS"; KEY_ALIAS="sab-passw"
            keytool -genkeypair -noprompt -keystore "$KS" -storetype PKCS12 -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=SAB Passw"
            echo "::warning::No SAB_KEYSTORE_BASE64 secret set; signed with a one-off key. Export a backup before installing a newer build."
          fi
          echo "::add-mask::$KS_PASS"; echo "::add-mask::$KEY_PASS"
          {
            echo "SAB_KEYSTORE=$KS"
            echo "SAB_KEYSTORE_PASSWORD=$KS_PASS"
            echo "SAB_KEY_ALIAS=$KEY_ALIAS"
            echo "SAB_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SAB_VERSION_CODE: ${{ github.run_number }}
        run: gradle -p sab-passw-android assembleRelease --no-daemon --stacktrace

      - name: Verify offline-only permissions and signature
        run: |
          APK=sab-passw-android/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "Permissions requested by the APK:"
          "$BT/aapt2" dump permissions "$APK" | tee perms.txt
          if grep -Eq 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)' perms.txt; then
            echo "::error::The APK requests network access; SAB Passw must stay offline-only."; exit 1
          fi
          "$BT/apksigner" verify --print-certs "$APK"
          OUT="SAB-Passw-1.0.${{ github.run_number }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "### SAB Passw $OUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat perms.txt "$OUT.sha256" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: SAB-Passw-apk
          path: |
            SAB-Passw-*.apk
            SAB-Passw-*.apk.sha256
          retention-days: 30
